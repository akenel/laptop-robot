[project]
name = "laptop-robot"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "faster-whisper==1.2.1",
  "piper-tts==1.8.0",
  "PyYAML==6.0.4",
  "kokoro-onnx==0.6.1",
  "soundfile",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
